locations:
  - id: "library"
    name: "大学图书馆"
    description: "高大宽敞的图书馆，弥漫着油墨与纸张的气息，窗边有阳光洒在木质长桌上。"
    background_image: "library_day.png"
    available_actions:
      - id: "read_book"
        name: "找书阅读"
      - id: "study"
        name: "自习功课"
      - id: "chat"
        name: "搭话交谈"

  - id: "classroom"
    name: "主教学楼·302教室"
    description: "阶梯大教室，黑板上还残留着上一堂微积分的板书，窗外微风吹动窗帘。"
    background_image: "classroom_day.png"
    available_actions:
      - id: "attend_class"
        name: "认真听课"
      - id: "nap"
        name: "趴着打盹"
      - id: "chat"
        name: "同桌闲聊"

  - id: "cafeteria"
    name: "第二食堂"
    description: "充满食物香气的校园食堂，饭点时人来人往，角落有安静的靠窗双人座。"
    background_image: "cafeteria_day.png"
    available_actions:
      - id: "buy_lunch"
        name: "买午餐"
      - id: "invite_meal"
        name: "邀请共进午餐"

  - id: "sports_ground"
    name: "田径运动场"
    description: "开阔的红色跑道与绿茵场，常有微风拂过，傍晚时夕阳染红半边天。"
    background_image: "sports_ground_sunset.png"
    available_actions:
      - id: "jog"
        name: "跑步锻炼"
      - id: "rest_bench"
        name: "长椅吹风"

  - id: "dormitory"
    name: "学生宿舍区·林荫大道"
    description: "静谧温馨的学生生活区，楼下有常青樟树和自动贩卖机，夜间泛着暖黄灯火。"
    background_image: "dormitory_night.png"
    available_actions:
      - id: "rest"
        name: "回寝休息"
      - id: "vending"
        name: "买罐汽水"
      - id: "night_chat"
        name: "树下夜谈"

time_slots:
  - id: "morning"
    name: "早晨"
    start_time: "08:00"
    end_time: "11:30"
  - id: "noon"
    name: "中午"
    start_time: "11:30"
    end_time: "14:00"
  - id: "afternoon"
    name: "下午"
    start_time: "14:00"
    end_time: "17:30"
  - id: "dusk"
    name: "傍晚"
    start_time: "17:30"
    end_time: "20:00"
  - id: "night"
    name: "夜间"
    start_time: "20:00"
    end_time: "23:00"
